name: Publish visitor guide
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: iwashi-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the shop calendar
        run: python3 scripts/update-calendar.py
      - name: Check and assemble the site
        run: |
          node --check theme.js
          node --check site.js
          node --check schedule.js
          mkdir -p dist/assets
          cp index.html games.html ring-game.html tournaments.html beginner.html access.html faq.html details.css style.css calendar.css games.css theme.js site.js schedule.js schedule.json .nojekyll dist/
          cp assets/{room-hero.webp,room-film.mp4,blue-poker-table.webp,poker-hero.webp,poker-table.jpg,fish-print.png,iwashi-handwriting.png,mark.png,first-visit-room.webp,ring-game-joining.webp,game-option-ring.webp,game-option-tournament.webp,beginner-poker-table.webp,faq-poker-table.webp} dist/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
